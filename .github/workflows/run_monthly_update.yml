name: Update CLT Property Database

on:
  push:
    paths:
      - 'properties.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Execute Data Extraction
      run: python fetch_clt_data.py
      
    - name: Merge Regrid Data
      run: python merge_datasets.py

    - name: Commit and Push Updated Database
      run: |
        git config --global user.name "CLT Data Bot"
        git config --global user.email "actions@github.com"
        git add clt_property_database.csv master_combined_database.csv
        git commit -m "Automated update of property metrics and Regrid merge" || true
        git push || true
