name: Update CLT Property Database

on:
  push:
    paths:
      - 'properties.csv'
  workflow_dispatch: # Allows you to click a button in GitHub to run it manually

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Data Extraction
      run: python fetch_clt_data.py

    - name: Commit and Push Updated Database
      run: |
        git config --global user.name "CLT Data Bot"
        git config --global user.email "actions@github.com"
        git add clt_property_database.csv
        git diff-index --quiet HEAD || git commit -m "Automated update of property metrics"
        git push
